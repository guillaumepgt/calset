services:
  radicale-init:
    image: alpine
    container_name: radicale-init
    profiles: ["init"]
    volumes:
      - radicale-users:/etc/radicale/auth
      - radicale-data:/var/lib/radicale/collections
      - ./radicale/entrypoint.sh:/entrypoint.sh:ro
    environment:
        - CAL_USER=${CAL_USER:-my_user}
        - CAL_PASS=${CAL_PASS:-my_password}
    entrypoint: ["/bin/sh", "/entrypoint.sh"]

  radicale:
    image: tomsquest/docker-radicale:latest
    container_name: radicale
    restart: unless-stopped
    ports:
      - "127.0.0.1:5232:5232"
    volumes:
      - ./radicale/config:/etc/radicale/config:ro
      - radicale-data:/var/lib/radicale/collections
      - radicale-users:/etc/radicale/auth
    user: "2999:2999"
    healthcheck:
      test: ["CMD-SHELL", "curl -f -u $${CAL_USER:-my-user}:$${CAL_PASS:-my-password} http://localhost:5232/ || exit 1"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_interval: 10s

  calset-bot:
    build: .
    image: calset-bot:latest
    container_name: calset-bot
    restart: unless-stopped
    environment:
      - KEY_API_TELEGRAM=${KEY_API_TELEGRAM}
    depends_on:
      - radicale

volumes:
  radicale-data:
    name: radicale-data
  radicale-users:
    name: radicale-users